<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07164a"/>
      <stop offset="50%" stop-color="#0d257c"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="crimsonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#fde047"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000824" flood-opacity="0.35"/>
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#07164a" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Ambient Glows -->
  <circle cx="650" cy="110" r="180" fill="#e11d48" opacity="0.18"/>
  <circle cx="150" cy="390" r="210" fill="#38bdf8" opacity="0.14"/>

  <!-- Main Smart Classroom Interactive Board -->
  <g filter="url(#shadow)">
    <rect x="70" y="45" width="660" height="390" rx="22" fill="url(#screenGrad)" stroke="#cbd5e1" stroke-width="4"/>
    <!-- Top Browser / Smartboard Header -->
    <path d="M74 67 C74 55 83 47 95 47 L705 47 C717 47 726 55 726 67 L726 92 L74 92 Z" fill="#07164a"/>
    <circle cx="104" cy="70" r="7" fill="#f43f5e"/>
    <circle cx="126" cy="70" r="7" fill="#fbbf24"/>
    <circle cx="148" cy="70" r="7" fill="#34d399"/>
    <rect x="230" y="59" width="340" height="22" rx="11" fill="#1e3a8a"/>
    <text x="400" y="75" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#fde047" text-anchor="middle">SBY Smart Classroom Media Hub • @sby.ac.th</text>
  </g>

  <!-- Left Widget: Spinning Wheel of Names -->
  <g transform="translate(215, 225)" filter="url(#cardShadow)">
    <circle cx="0" cy="0" r="96" fill="#ffffff" stroke="#e2e8f0" stroke-width="4"/>
    <path d="M0,0 L0,-88 A88,88 0 0,1 76.2,-44 Z" fill="#e11d48"/>
    <path d="M0,0 L76.2,-44 A88,88 0 0,1 76.2,44 Z" fill="#fb923c"/>
    <path d="M0,0 L76.2,44 A88,88 0 0,1 0,88 Z" fill="#facc15"/>
    <path d="M0,0 L0,88 A88,88 0 0,1 -76.2,44 Z" fill="#10b981"/>
    <path d="M0,0 L-76.2,44 A88,88 0 0,1 -76.2,-44 Z" fill="#0284c7"/>
    <path d="M0,0 L-76.2,-44 A88,88 0 0,1 0,-88 Z" fill="#6366f1"/>
    <circle cx="0" cy="0" r="22" fill="#ffffff" stroke="#07164a" stroke-width="5"/>
    <polygon points="84,-10 106,0 84,10" fill="#07164a"/>
  </g>

  <!-- Top Right Widget: Millionaire & Quiz Stage -->
  <g transform="translate(345, 112)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="350" height="105" rx="14" fill="#0d257c"/>
    <rect x="16" y="14" width="318" height="32" rx="8" fill="#1e3a8a" stroke="#fde047" stroke-width="1.5"/>
    <text x="175" y="35" font-family="Sarabun, sans-serif" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">🏆 เกมเศรษฐี &amp; แข่งขันตอบคำถามหน้าชั้นเรียน</text>
    <rect x="16" y="56" width="152" height="32" rx="8" fill="#10b981"/>
    <text x="92" y="77" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">ก. ถูกต้อง +1,000 แต้ม</text>
    <rect x="182" y="56" width="152" height="32" rx="8" fill="#ffffff" opacity="0.16"/>
    <text x="258" y="77" font-family="Sarabun, sans-serif" font-size="12" font-weight="700" fill="#e2e8f0" text-anchor="middle">ข. ตัวเลือกที่ 2</text>
  </g>

  <!-- Middle Right Widget: Class Points & Memory Cards -->
  <g transform="translate(345, 232)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="168" height="92" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="46" r="24" fill="#dbeafe"/>
    <text x="40" y="54" font-size="22" text-anchor="middle">⭐</text>
    <text x="74" y="40" font-family="Sarabun, sans-serif" font-size="13" font-weight="800" fill="#07164a">แต้มพฤติกรรม</text>
    <text x="74" y="62" font-family="Sarabun, sans-serif" font-size="18" font-weight="800" fill="#0284c7">+250 คะแนน</text>
  </g>

  <g transform="translate(527, 232)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="168" height="92" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <circle cx="40" cy="46" r="24" fill="#fce7f3"/>
    <text x="40" y="54" font-size="22" text-anchor="middle">🚨</text>
    <text x="74" y="40" font-family="Sarabun, sans-serif" font-size="13" font-weight="800" fill="#07164a">Buzzer &amp; จับเวลา</text>
    <text x="74" y="62" font-family="Sarabun, sans-serif" font-size="16" font-weight="800" fill="#e11d48">00:15.00 วินาที</text>
  </g>

  <!-- Bottom Cloud Sync Banner inside Board -->
  <g transform="translate(105, 346)" filter="url(#cardShadow)">
    <rect x="0" y="0" width="590" height="62" rx="14" fill="url(#crimsonGrad)"/>
    <text x="295" y="27" font-family="Sarabun, sans-serif" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">☁️ เชื่อมต่อฐานข้อมูลนักเรียนส่วนกลางอัตโนมัติ (Cloudflare D1 &amp; Google Sign-In)</text>
    <text x="295" y="48" font-family="Sarabun, sans-serif" font-size="12.5" font-weight="600" fill="#ffe4e6" text-anchor="middle">ตั้งค่ารายชื่อนักเรียนครั้งเดียว ใช้งานได้ครบทั้ง 7 ระบบ • ออกรายงานราชการ (.docx) ทันที</text>
  </g>
</svg>
