<body class="vs-theme-buzzer">
<div class="app-shell">
    <aside class="app-sidebar" aria-label="เมนูหลัก">
        <div class="sb-brand">
            <span class="sb-brand-icon"><i class="fas fa-bolt"></i></span>
            <div><b>กดปุ่มตอบเร็ว</b><small id="sb-school">แข่งตอบคำถามหน้าชั้นเรียน</small></div>
            <button type="button" class="sb-close" data-sb-close aria-label="ปิดเมนู"><i class="fas fa-xmark"></i></button>
        </div>
        <nav class="sb-menu">
            <a class="sb-link" data-r="home" href="#/home"><i class="fas fa-house"></i><span>หน้าหลัก</span></a>
            <a class="sb-link" data-r="play" href="#/play"><i class="fas fa-bolt"></i><span>เริ่มแข่งขัน</span></a>
            <div class="sb-group">เตรียมการแข่ง</div>
            <a class="sb-link" data-r="teams" href="#/teams"><i class="fas fa-people-group"></i><span>ทีมและปุ่มกด</span><span class="sb-badge" id="bd-teams">0</span></a>
            <a class="sb-link" data-r="questions" href="#/questions"><i class="fas fa-circle-question"></i><span>คลังคำถาม</span><span class="sb-badge" id="bd-q">0</span></a>
            <div class="sb-group">ผลและรายงาน</div>
            <a class="sb-link" data-r="results" href="#/results"><i class="fas fa-trophy"></i><span>ผลการแข่งขัน</span><span class="sb-badge" id="bd-m">0</span></a>
            <a class="sb-link" data-r="reports" href="#/reports"><i class="fas fa-file-word"></i><span>รายงาน (แบบราชการ)</span></a>
            <a class="sb-link" data-r="settings" href="#/settings"><i class="fas fa-sliders"></i><span>ตั้งค่าและแม่แบบ</span></a>
        </nav>
        <div class="sb-foot">
            <div class="sb-backup" id="sb-backup"></div>
            <div class="sb-backup-actions">
                <button type="button" class="btn-x green sm" id="sb-save"><i class="fas fa-download"></i>บันทึกไฟล์ข้อมูล</button>
                <button type="button" class="btn-x ghost sm" id="sb-open" data-demo-lock="เปิดไฟล์ข้อมูล (.json)"><i class="fas fa-folder-open"></i>เปิดไฟล์</button>
            </div>
        </div>
    </aside>
    <div class="sb-backdrop" data-sb-close></div>

    <div class="app-main">
        <header class="app-topbar">
            <button type="button" class="tb-burger" data-sb-open aria-label="เปิดเมนู"><i class="fas fa-bars"></i></button>
            <div class="tb-title" id="tb-title"></div>
            <div class="tb-right">
                <span class="tb-saved" id="tb-saved"><i class="fas fa-circle-check"></i><span>บันทึกแล้ว</span></span>
                <button type="button" class="btn-x green sm" id="tb-backup-btn"><i class="fas fa-download"></i><span class="tb-hide-sm">บันทึกไฟล์ข้อมูล</span></button>
            </div>
        </header>
        <main class="app-content" id="view"></main>
    </div>
